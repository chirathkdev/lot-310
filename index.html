<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Lot 310 Barcelona 26+</title>
<style>
:root{--bg:#eceae5;--card:#fbfaf7;--fg:#1d2126;--muted:#5d646c;--line:#cfccc4;--accent:#2f5d8a;--bad:#a33a2a;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#15181b;--card:#1e2226;--fg:#e9e7e2;--muted:#9aa1a8;--line:#363b41;--accent:#7fb0dc;--bad:#e08a7a;color-scheme:dark}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center;padding:16px;box-sizing:border-box}
form{width:min(360px,100%);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:24px;display:grid;gap:14px;box-sizing:border-box}
h1{margin:0;font-size:20px;letter-spacing:-.01em}
p{margin:0;color:var(--muted);font-size:13px}
label{display:grid;gap:6px;font-size:13px;color:var(--muted)}
input[type=password]{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
input[type=password]:focus{outline:2px solid var(--accent);outline-offset:1px}
.row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
button{font:inherit;font-weight:600;color:#fff;background:var(--accent);border:0;border-radius:6px;padding:10px 12px;cursor:pointer}
button:disabled{opacity:.6;cursor:progress}
#msg{min-height:1.2em;font-size:13px;color:var(--bad)}
#prog{display:grid;gap:6px;font-size:13px;color:var(--muted)}
#prog[hidden]{display:none}
#bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
#bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
</style>
</head>
<body>
<form id="f">
  <h1>Lot 310 · Barcelona 26+</h1>
  <p>This page is private. Enter the password you were given.</p>
  <label>Password<input id="pw" type="password" autocomplete="current-password" required autofocus></label>
  <label class="row"><input id="keep" type="checkbox"> Keep me signed in on this device</label>
  <button id="go" type="submit">Open</button>
  <div id="prog" role="status" aria-live="polite" hidden><span id="ptext">Checking password…</span><div id="bar" aria-hidden="true"><i id="pbar"></i></div></div>
  <div id="msg" role="status"></div>
</form>
<script>
const SALT = 'CjTHA+4nMvaq8kQCKhm9sQ==', ITER = 600000, STILLS = ["back_yard-empty-day","back_yard-empty-eve","back_yard-furn-day","back_yard-furn-eve","back_yard","bathroom-empty-day","bathroom-empty-eve","bathroom-furn-day","bathroom-furn-eve","bathroom","bed1-empty-day","bed1-empty-eve","bed1-furn-day","bed1-furn-eve","bed1","bed2-empty-day","bed2-empty-eve","bed2-furn-day","bed2-furn-eve","bed3-empty-day","bed3-empty-eve","bed3-furn-day","bed3-furn-eve","bed4-empty-day","bed4-empty-eve","bed4-furn-day","bed4-furn-eve","butlers-empty-day","butlers-empty-eve","butlers-furn-day","butlers-furn-eve","dining-empty-day","dining-empty-eve","dining-furn-day","dining-furn-eve","dining","ensuite-empty-day","ensuite-empty-eve","ensuite-furn-day","ensuite-furn-eve","ensuite","kitchen-empty-day","kitchen-empty-eve","kitchen-furn-day","kitchen-furn-eve","kitchen","laundry-empty-day","laundry-empty-eve","laundry-furn-day","laundry-furn-eve","living-empty-day","living-empty-eve","living-furn-day","living-furn-eve","living","pool-empty-day","pool-empty-eve","pool-furn-day","pool-furn-eve","pool","powder-empty-day","powder-empty-eve","powder-furn-day","powder-furn-eve","side_yard-empty-day","side_yard-empty-eve","side_yard-furn-day","side_yard-furn-eve","side_yard","street-empty-day","street-empty-eve","street-furn-day","street-furn-eve","street_day","street_dusk","study-empty-day","study-empty-eve","study-furn-day","study-furn-eve","theatre-empty-day","theatre-empty-eve","theatre-furn-day","theatre-furn-eve","wir-empty-day","wir-empty-eve","wir-furn-day","wir-furn-eve"], STORE = 'lot310-key';
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64 = u => btoa(String.fromCharCode(...u));
const msg = document.getElementById('msg'), go = document.getElementById('go');
const prog = (t, pct) => { const p = document.getElementById('prog'); if (t == null){ p.hidden = true; return; } p.hidden = false; document.getElementById('ptext').textContent = t; document.getElementById('pbar').style.width = (pct ?? 0) + '%'; };
const get = k => { try { return sessionStorage.getItem(k) || localStorage.getItem(k); } catch { return null; } };
const forget = () => { try { sessionStorage.removeItem(STORE); localStorage.removeItem(STORE); } catch {} };

async function derive(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: unb64(SALT), iterations: ITER, hash: 'SHA-256' }, base, 256));
}
async function open(raw, keep){
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const unseal = async buf => { const u = new Uint8Array(buf); return crypto.subtle.decrypt({ name: 'AES-GCM', iv: u.slice(0, 12) }, key, u.slice(12)); };
  prog('Downloading the 3D page…', 5);
  const res = await fetch('page.gz.bin', { cache: 'no-cache' });
  if (!res.ok) throw new Error('fetch');
  // stream it so the bar shows real progress (Content-Length may be missing behind compression; then it just fills at the end)
  const total = +res.headers.get('content-length') || 0, chunks = []; let got = 0;
  if (res.body && total){ const rd = res.body.getReader(); for (;;){ const { done, value } = await rd.read(); if (done) break; chunks.push(value); got += value.length; prog(`Downloading the 3D page… ${Math.round(got / total * 100)}%`, 5 + got / total * 80); } }
  const buf = total ? (() => { const b = new Uint8Array(got); let o = 0; for (const c of chunks){ b.set(c, o); o += c.length; } return b.buffer; })() : await res.arrayBuffer();
  prog('Unlocking…', 90);
  const plain = await unseal(buf);   // throws on a wrong password
  const html = await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  prog('Starting the 3D view…', 100);
  try { sessionStorage.setItem(STORE, b64(raw)); if (keep) localStorage.setItem(STORE, b64(raw)); } catch {}
  // photos: decrypted in the background; the page asks window.__still(name) and is filled in as each arrives
  const urls = {}, blank = 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
  const asked = {}, load = f => { if (asked[f] || !STILLS.includes(f)) return; asked[f] = 1;
    fetch('stills/' + f + '.bin').then(r => r.arrayBuffer()).then(unseal).then(b => {
      urls[f] = URL.createObjectURL(new Blob([b], { type: 'image/jpeg' }));
      document.querySelectorAll('[data-still="' + f + '"]').forEach(img => { img.src = urls[f]; });
    }).catch(() => { asked[f] = 0; }); };
  window.__stillList = STILLS;   // the gallery shows only the photos this build carries
  window.__still = f => { load(f); return urls[f] || blank; };   // the other versions load when the gallery asks for them
  STILLS.filter(f => !/-(empty|eve)(-|$)/.test(f)).forEach(load);   // the default set (furnished, day) up front
  document.open(); document.write(html); document.close();
}

const saved = get(STORE);
if (saved) { go.disabled = true; msg.textContent = ''; open(unb64(saved), false).catch(() => { forget(); prog(null); go.disabled = false; }); }

document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault(); go.disabled = true; msg.textContent = ''; prog('Checking password…', 2);
  try { await open(await derive(document.getElementById('pw').value), document.getElementById('keep').checked); }
  catch (err) { prog(null); msg.textContent = err.message === 'fetch' ? 'Could not load the page. Check your connection and try again.' : 'That password is not right.'; go.disabled = false; }
});
</script>
</body>
</html>
